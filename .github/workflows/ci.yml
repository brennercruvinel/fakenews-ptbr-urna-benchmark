name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: uv.lock matches pyproject.toml
        # no uv sync: the locked env carries torch, and no check below needs it
        run: uv lock --check

      - name: lint the bench tools
        run: uvx ruff check benchmark

      - name: tracked release sidecars match their SHA256SUMS
        # the .urna and the chunk map are on the hub; the build lock and the
        # manifest are tracked here and must be the bytes the sums name
        run: |
          for d in release/v0.1/*/; do
            (cd "$d" && sha256sum --ignore-missing -c SHA256SUMS) || exit 1
          done

      - name: rendered report is up to date
        run: python benchmark/tools/render_report.py --check

      - name: no tracked file names a machine
        run: |
          hits=$(git ls-files | xargs grep -l -e '/Users''/' -e '/home''/' -e 'Library/Application'' Support' -e 'nn/D''ev' || true)
          dashes=$(git ls-files | xargs grep -l "$(printf '\342\200\224')" || true)
          if [ -n "$dashes" ]; then
            echo "em dash in tracked files:"
            echo "$dashes"
            exit 1
          fi
          if [ -n "$hits" ]; then
            echo "machine-local paths in tracked files:"
            echo "$hits"
            exit 1
          fi
